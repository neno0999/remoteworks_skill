name: Sync data

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live data
        run: curl -fsSL --retry 3 -A "remoteworks-skill-sync/1.0 (+https://github.com/neno0999/remoteworks_skill)" -o /tmp/platforms.json https://wasian.my.id/remoteworks/platforms.json
      - name: Validate (refuse broken or shrunken data)
        run: |
          python3 - <<'PY'
          import json, sys
          new = json.load(open('/tmp/platforms.json', encoding='utf-8'))
          old = json.load(open('skills/remoteworks-matcher/data/platforms.json', encoding='utf-8'))
          assert new['meta']['license'] == 'CC BY 4.0', 'license changed'
          assert new['meta']['count'] == len(new['platforms']), 'count mismatch'
          assert len(new['platforms']) >= 0.8 * len(old['platforms']), 'dataset shrank more than 20%'
          ids = [p['id'] for p in new['platforms']]
          assert len(ids) == len(set(ids)), 'duplicate ids'
          for p in new['platforms']:
              assert p['link'].startswith('https://') and p['type'] in new['meta']['types'], p['id']
              assert all(t in new['meta']['skill_tags'] for t in p['skills']), p['id']
              assert isinstance(p['affiliate'], bool), p['id']
          print('ok', len(new['platforms']))
          PY
      - name: Copy, test, open a PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          cp /tmp/platforms.json skills/remoteworks-matcher/data/platforms.json
          python3 -m unittest discover -s tests
          if git diff --quiet; then
            echo "Snapshot already up to date, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-sync
          git add skills/remoteworks-matcher/data/platforms.json
          git commit -m "chore(data): sync platforms.json from wasian.my.id"
          git push --force origin data-sync
          if [ -z "$(gh pr list --head data-sync --state open --json number -q '.[0].number')" ]; then
            gh pr create --base "$BASE" --head data-sync \
              --title "chore(data): sync platforms.json from wasian.my.id" \
              --body "Automated weekly data sync. The validation step and the unit tests passed. Review the diff, then merge."
          else
            echo "An open sync PR already exists; the branch was updated."
          fi
